<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Kestrel — AI photo editing for Lightroom</title>
<meta name="description" content="Kestrel is a professional AI photo editing engine for Adobe Lightroom Classic: analyse, understand and edit every photograph individually." />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="icon" href="/brand/kestrel-icon-64.png" sizes="64x64" type="image/png" />
<link rel="apple-touch-icon" href="/brand/kestrel-icon-256.png" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Kestrel — AI photo editing for Adobe Lightroom" />
<meta property="og:description" content="Analysis-first, explainable, non-destructive photo finishing for Lightroom Classic. Sports-first, built for batches of thousands." />
<meta property="og:image" content="/brand/social-preview.png" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-mark">
    <img src="/assets/brand-mark.svg" width="64" height="64" alt="" />
    <div>Kestrel</div>
  </div>
  <p id="boot-msg">Starting the engine…</p>
</div>

<div id="app" class="app" hidden>
  <aside class="rail">
    <div class="brand">
      <img class="brand-mark" src="/assets/brand-mark.svg" width="30" height="30" alt="" />
      <div class="brand-text">
        <strong>Kestrel</strong>
        <span id="brand-version">v1.0</span>
      </div>
    </div>
    <nav id="nav" class="nav" aria-label="Main">
      <button data-view="dashboard" class="nav-item"><span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="6" height="6" rx="1.4"/><rect x="11.5" y="2.5" width="6" height="6" rx="1.4"/><rect x="2.5" y="11.5" width="6" height="6" rx="1.4"/><rect x="11.5" y="11.5" width="6" height="6" rx="1.4"/></svg></span><span>Dashboard</span></button>
      <button data-view="library" class="nav-item"><span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M2.5 13.2 7 9.2l3.2 2.8L13.6 8.6l3.9 3.6"/><circle cx="12.4" cy="6.9" r="1.1"/></svg></span><span>Library</span></button>
      <button data-view="batch" class="nav-item"><span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="2.5" width="9" height="9" rx="1.6"/><rect x="8.5" y="8.5" width="9" height="9" rx="1.6"/></svg></span><span>Batch</span></button>
      <button data-view="profiles" class="nav-item"><span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="M10 3.2v13.6M3.4 10h13.2"/></svg></span><span>Profiles</span></button>
      <button data-view="settings" class="nav-item"><span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.6v2.2M10 15.2v2.2M17.4 10h-2.2M4.8 10H2.6M15.2 4.8l-1.6 1.6M6.4 13.6l-1.6 1.6M15.2 15.2l-1.6-1.6M6.4 6.4 4.8 4.8"/></svg></span><span>Settings</span></button>
      <button data-view="docs" class="nav-item"><span class="nav-ico"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3.4h8.2L16 7.2v9.4H4z"/><path d="M12 3.6v3.8H16M7 10.4h6M7 13.4h4.4"/></svg></span><span>Guide</span></button>
    </nav>
    <div class="rail-foot">
      <div id="licence-chip" class="chip chip-muted" title="Licence status">trial</div>
      <div id="queue-chip" class="chip chip-muted" title="Processing queue">idle</div>
      <div class="rail-note">Runs locally.<br>Your photographs never leave this machine.</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="top-title">Dashboard</h1>
        <span id="top-sub">Local engine</span>
      </div>
      <div class="topbar-actions">
        <span id="hw-chip" class="chip chip-muted">—</span>
        <span id="health-chip" class="chip chip-muted">connecting…</span>
      </div>
    </header>
    <div id="view" class="view" aria-live="polite"></div>
  </div>
</div>

<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status"></div>
<script src="/views.js"></script>
<script src="/editor.js"></script>
<script src="/app.js"></script>
</body>
</html>
