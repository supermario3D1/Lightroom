name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.10"
          - os: windows-latest
            python: "3.10"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Environment report
        run: kestrel doctor
      - name: Unit tests
        run: pytest -q
      - name: CLI smoke
        run: |
          kestrel collections
          kestrel profiles

  plugin:
    name: Lightroom plug-in · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install lupa
      - name: Executable plug-in specification
        run: python scripts/ci_run.py --title "Plug-in specification" -- python -m tests.lightroom.lua_harness
      - name: Lua syntax check (when a Lua interpreter is present)
        shell: bash  # Windows defaults to PowerShell, which cannot run this script
        run: |
          if command -v luac >/dev/null 2>&1; then
            for f in lightroom/Kestrel.lrplugin/*.lua; do luac -p "$f" || exit 1; done
            echo "all plug-in files parse"
          else
            echo "luac not installed — the harness compiled every file instead"
          fi

  packaging:
    name: Packaging and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" build
      - name: Packaged web UI is current
        run: |
          python scripts/sync_web.py
          git diff --exit-code -- src/kestrel/api/static
      - name: Brand assets are current
        # Vectors, manifest and dimensions only: PNG bytes depend on the
        # Pillow/FreeType/zlib build, so a byte diff is not a portable gate.
        run: python scripts/brand.py --check
      - name: Build wheel and sdist
        run: python -m build
      - name: Install the wheel and serve it once
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install dist/*.whl
          KESTREL_HOME=/tmp/wheelhome /tmp/wheelcheck/bin/kestrel doctor
          test -f /tmp/wheelcheck/lib/python3.12/site-packages/kestrel/api/static/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-dist
          path: dist/*

  web:
    name: Workspace smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e .
      - name: JavaScript parses
        run: |
          node --check web/app.js
          node --check web/views.js
          node --check web/editor.js
      - name: jsdom boot test
        run: |
          npm install --no-save jsdom
          KESTREL_HOME=/tmp/cihome kestrel serve --host 127.0.0.1 --port 8765 &
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8765/api/health >/dev/null && break; sleep 1; done
          node tests/web/boot.js
          kill %1
